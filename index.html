<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gerar link/QR</title>
  <style>
    body{ font-family: system-ui, -apple-system, Segoe UI, Roboto; margin:24px; background:#0b0b0b; color:#eee; }
    .card{ max-width:720px; padding:20px; border-radius:16px; border:1px solid #222; background:#111; box-shadow:0 8px 24px rgba(0,0,0,.25); }
    label{ display:block; margin:12px 0 6px; font-weight:600; }
    input{ width:100%; padding:12px; border-radius:12px; border:1px solid #333; background:#1a1a1a; color:#eee; }
    .row{ display:flex; gap:12px; flex-wrap:wrap; }
    .col{ flex:1; min-width:220px; }
    button{ padding:12px 16px; border:none; border-radius:12px; cursor:pointer; margin-right:8px; }
    .btn-primary{ background:#4f46e5; color:#fff; }
    .btn-secondary{ background:#334155; color:#fff; }
    .out{ margin-top:12px; padding:12px; border-radius:12px; border:1px dashed #333; background:#0b0b0b; word-break:break-all; }
    .qr{ margin-top:16px; display:grid; place-items:center; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Gerar link/QR da Avaliação</h2>
    <p style="opacity:.8">Uso interno. O cliente <b>não</b> avalia aqui.</p>

    <div class="row">
      <div class="col">
        <label>Nome do vendedor</label>
        <input id="vendedor" placeholder="Ex.: Maria Santos" />
      </div>
      <div class="col">
        <label>Nº DAV / OS</label>
        <input id="dav" placeholder="Ex.: 123456" />
      </div>
    </div>

    <div class="row">
      <div class="col">
        <label>Máx. de respostas por link</label>
        <input id="max" type="number" min="1" value="1" />
      </div>
      <div class="col">
        <label>Validade (minutos)</label>
        <input id="exp" type="number" min="5" value="1440" />
      </div>
    </div>

    <div style="margin-top:16px">
      <button class="btn-primary" onclick="gerar('link')">Gerar link</button>
      <button class="btn-secondary" onclick="gerar('qr')">Gerar QR</button>
    </div>

    <div id="saida" class="out" style="display:none"></div>
    <div id="qr" class="qr"></div>
  </div>

  <script>
    const baseUrl = "<?= baseUrl ?>";

    function gerar(tipo){
      const vendedor = document.getElementById('vendedor').value.trim();
      const dav = document.getElementById('dav').value.trim();
      const max = parseInt(document.getElementById('max').value || '1', 10);
      const exp = parseInt(document.getElementById('exp').value || '1440', 10);

      if(!vendedor || !dav){ alert('Preencha vendedor e DAV.'); return; }

      google.script.run.withSuccessHandler(function(res){
        const out = document.getElementById('saida');
        out.style.display = 'block';
        out.textContent = res.url;

        if (tipo === 'qr') {
          document.getElementById('qr').innerHTML = '<img src="'+res.qr+'" width="240" height="240" alt="QR">';
        } else {
          document.getElementById('qr').innerHTML = '';
        }
      }).withFailureHandler(function(err){
        alert((err && err.message) ? err.message : err);
      }).gerarConvite(vendedor, dav, max, exp);
    }
  </script>
</body>
</html>
